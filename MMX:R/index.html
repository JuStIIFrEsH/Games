<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Regenesis</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Regenesis">
<style>
html, body, #canvas {
    margin: 0;
    padding: 0;
    border: 0;
    width: 100%;
    height: 100%;
}
html, body {
    overflow: hidden;
    background: #000;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
}
#canvas {
    display: block;
    visibility: hidden;
    touch-action: none;
}
#launcher {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
#panel {
    width: min(520px, calc(100vw - 48px));
    text-align: center;
}
#logo {
    width: 112px;
    height: 112px;
    image-rendering: pixelated;
    border-radius: 22px;
    margin-bottom: 20px;
}
h1 {
    margin: 0 0 10px;
    font-size: 26px;
}
p {
    margin: 0 0 24px;
    opacity: .72;
    line-height: 1.45;
}
button {
    appearance: none;
    border: 0;
    border-radius: 12px;
    padding: 13px 20px;
    font: 600 17px -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff;
    color: #000;
}
button:disabled {
    opacity: .45;
}
#status {
    display: none;
    margin-top: 18px;
    font-size: 14px;
    opacity: .72;
}
#status:not(:empty) {
    display: block;
}
input[type=file] {
    display: none;
}
</style>

</head>
<body>
<canvas id="canvas">Your browser does not support canvas.</canvas>

<div id="launcher">
    <div id="panel">
        <img id="logo" src="./icon-192.png" alt="">
        <h1>Mega Man X Regenesis</h1>
        <button id="choose">Choose Game File</button>
        <input id="file" type="file" accept=".pck,application/octet-stream">
        <div id="status"></div>
    </div>
</div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1712,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const engine = new Engine(GODOT_CONFIG);

const choose = document.getElementById("choose");
const input = document.getElementById("file");
const status = document.getElementById("status");
const launcher = document.getElementById("launcher");
const canvas = document.getElementById("canvas");

function setStatus(text) {
    status.textContent = text;
}

choose.addEventListener("click", () => input.click());

input.addEventListener("change", async () => {
    const file = input.files && input.files[0];
    if (!file) return;

    choose.disabled = true;

    try {
        setStatus("Reading game file…");
        const buffer = await file.arrayBuffer();

        // Godot PCK magic: GDPC
        const head = new Uint8Array(buffer, 0, Math.min(buffer.byteLength, 4));
        if (head.length < 4 ||
            head[0] !== 0x47 || head[1] !== 0x44 ||
            head[2] !== 0x50 || head[3] !== 0x43) {
            throw new Error("That does not appear to be a Godot PCK file.");
        }

        setStatus("Starting Godot…");

        // Godot's Web API supports preloading an ArrayBuffer into its virtual
        // filesystem before startup, then selecting it with --main-pack.
        await engine.init(GODOT_CONFIG.executable);
        await engine.preloadFile(buffer, "/Regenesis.pck");

        setStatus("Starting Regenesis…");

        await engine.start({
            args: ["--main-pack", "/Regenesis.pck"],
            canvas: canvas,
            canvasResizePolicy: 2
        });

        launcher.remove();
        canvas.style.visibility = "visible";
        canvas.focus();
    } catch (err) {
        console.error(err);
        setStatus("Could not start: " + (err && err.message ? err.message : String(err)));
        choose.disabled = false;
        input.value = "";
    }
});
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js", {scope:"./"})
      .catch(err => console.error("Launcher offline install failed:", err));
  });
}
</script>
</body>
</html>
