name: Build MMX:R Pages Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'MMX:R/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main for publishing
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build pinned Godot 4.7 no-threads launcher
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SRC="$ROOT/MMX:R"
          WORK="$RUNNER_TEMP/mmxr-build"
          GODOT_DIR="$WORK/godot"
          TEMPLATES_DIR="$WORK/templates"
          DUMMY="$WORK/dummy"
          mkdir -p "$GODOT_DIR" "$TEMPLATES_DIR" "$DUMMY"

          curl -L --fail --retry 3 \
            -o "$WORK/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
          curl -L --fail --retry 3 \
            -o "$WORK/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz"

          unzip -q "$WORK/godot.zip" -d "$GODOT_DIR"
          unzip -q "$WORK/templates.tpz" -d "$TEMPLATES_DIR"

          GODOT="$(find "$GODOT_DIR" -maxdepth 2 -type f -name 'Godot_v4.7-stable_linux.x86_64' | head -n 1)"
          RELEASE="$(find "$TEMPLATES_DIR" -type f -name 'web_nothreads_release.zip' | head -n 1)"
          test -n "$GODOT" && test -n "$RELEASE"
          chmod +x "$GODOT"

          cp "$SRC/launcher_shell.html" "$DUMMY/launcher_shell.html"

          cat > "$DUMMY/project.godot" <<'PROJECT'
          [application]

          config/name="Regenesis Launcher"
          run/main_scene="res://main.tscn"

          [display]

          window/size/viewport_width=640
          window/size/viewport_height=360
          window/stretch/mode="canvas_items"

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          PROJECT

          cat > "$DUMMY/main.tscn" <<'SCENE'
          [gd_scene format=3]

          [node name="Bootstrap" type="Node"]
          SCENE

          cat > "$DUMMY/export_presets.cfg" <<EOF
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release="$RELEASE"
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=false
          vram_texture_compression/for_mobile=false
          html/export_icon=false
          html/custom_html_shell="$DUMMY/launcher_shell.html"
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          progressive_web_app/enabled=false
          EOF

          "$GODOT" --headless --path "$DUMMY" --export-release "Web" "$SRC/index.html"
          rm -f "$SRC/index.pck"

      - name: Create Pages manifest and offline service worker
        shell: python
        run: |
          from pathlib import Path
          import json

          d = Path("MMX:R")
          manifest = {
              "name": "Mega Man X Regenesis",
              "short_name": "Regenesis",
              "start_url": "./index.html",
              "scope": "./",
              "display": "standalone",
              "orientation": "landscape",
              "background_color": "#000000",
              "theme_color": "#000000",
              "icons": [
                  {"src": "./icon-192.png", "sizes": "192x192", "type": "image/png"},
                  {"src": "./icon-512.png", "sizes": "512x512", "type": "image/png"},
              ],
          }
          (d / "manifest.webmanifest").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          exts = {".html", ".js", ".wasm", ".png", ".webmanifest", ".css", ".json"}
          assets = sorted(p.name for p in d.iterdir() if p.is_file() and p.suffix in exts)
          asset_lines = ",\n".join(f'  "./{name}"' for name in assets if name != "service-worker.js")
          sw = f'''const CACHE = "regenesis-local-launcher-v1";
          const ASSETS = [
          {asset_lines}
          ];

          self.addEventListener("install", event => {{
            event.waitUntil(
              caches.open(CACHE)
                .then(async cache => {{
                  for (const asset of ASSETS) {{
                    await cache.add(asset);
                  }}
                }})
                .then(() => self.skipWaiting())
            );
          }});

          self.addEventListener("activate", event => {{
            event.waitUntil(
              caches.keys()
                .then(names => Promise.all(
                  names.filter(n => n.startsWith("regenesis-local-launcher-") && n !== CACHE)
                       .map(n => caches.delete(n))
                ))
                .then(() => self.clients.claim())
            );
          }});

          self.addEventListener("fetch", event => {{
            if (event.request.method !== "GET") return;
            if (event.request.mode === "navigate") {{
              event.respondWith(
                caches.match("./index.html", {{ ignoreSearch: true }})
                  .then(hit => hit || fetch(event.request))
              );
              return;
            }}
            event.respondWith(
              caches.match(event.request, {{ ignoreSearch: true }})
                .then(hit => hit || fetch(event.request))
            );
          }});
          '''
          (d / "service-worker.js").write_text(sw, encoding="utf-8")

          html_path = d / "index.html"
          html = html_path.read_text(encoding="utf-8")
          register = '''<script>
          if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
              navigator.serviceWorker.register("./service-worker.js", {scope:"./"})
                .catch(err => console.error("Launcher offline install failed:", err));
            });
          }
          </script>'''
          if "serviceWorker.register" not in html:
              html = html.replace("</body>", register + "\n</body>")
          html_path.write_text(html, encoding="utf-8")

      - name: Validate publish set
        shell: bash
        run: |
          set -euo pipefail
          test -f 'MMX:R/index.html'
          test -f 'MMX:R/index.js'
          test -f 'MMX:R/index.wasm'
          test -f 'MMX:R/manifest.webmanifest'
          test -f 'MMX:R/service-worker.js'
          test ! -e 'MMX:R/index.pck'
          ! find 'MMX:R' -maxdepth 1 -type f -iname '*.pck' | grep -q .
          ls -lh 'MMX:R'

      - name: Commit generated runtime to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'MMX:R/index.html' 'MMX:R/index.js' 'MMX:R/index.wasm' 'MMX:R/manifest.webmanifest' 'MMX:R/service-worker.js'
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build MMX:R Godot 4.7 Pages runtime [skip ci]"
          git push origin HEAD:main
